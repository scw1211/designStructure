<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到功能演示 - Vue问答平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .demo-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 800px;
            width: 100%;
        }
        
        .demo-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .demo-title {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .demo-subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .checkin-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .checkin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .checkin-title {
            font-size: 1.5em;
            font-weight: 600;
        }
        
        .checkin-status {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .checkin-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .checkin-action {
            text-align: center;
        }
        
        .checkin-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkin-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .checkin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .api-demo {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .api-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #333;
        }
        
        .api-endpoint {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            word-break: break-all;
        }
        
        .api-response {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }
        
        .test-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .test-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .test-btn:hover {
            background: #0056b3;
        }
        
        .feature-list {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .feature-title {
            color: #856404;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            color: #856404;
        }
        
        .feature-icon {
            margin-right: 10px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-header">
            <h1 class="demo-title">📅 每日签到功能</h1>
            <p class="demo-subtitle">Vue问答平台 - 声望系统演示</p>
        </div>

        <!-- 签到卡片演示 -->
        <div class="checkin-card">
            <div class="checkin-header">
                <div class="checkin-title">📅 每日签到</div>
                <div class="checkin-status" id="checkinStatus">检查中...</div>
            </div>
            
            <div class="checkin-stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalDays">0</div>
                    <div class="stat-label">总签到天数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="consecutiveDays">0</div>
                    <div class="stat-label">连续签到</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalReputation">0</div>
                    <div class="stat-label">签到声望</div>
                </div>
            </div>
            
            <div class="checkin-action">
                <button class="checkin-btn" id="checkinBtn" onclick="performCheckin()">
                    🏆 立即签到 (+10声望)
                </button>
            </div>
        </div>

        <!-- API演示 -->
        <div class="api-demo">
            <h3 class="api-title">🔌 API接口演示</h3>
            
            <div style="margin-bottom: 15px;">
                <strong>签到状态检查：</strong>
                <div class="api-endpoint">GET /api/users/checkin/status</div>
                <div class="api-response" id="statusResponse">等待测试...</div>
            </div>
            
            <div>
                <strong>执行签到：</strong>
                <div class="api-endpoint">POST /api/users/checkin</div>
                <div class="api-response" id="checkinResponse">等待测试...</div>
            </div>
            
            <div class="test-buttons">
                <button class="test-btn" onclick="testCheckinStatus()">测试签到状态</button>
                <button class="test-btn" onclick="testCheckinStats()">测试签到统计</button>
                <button class="test-btn" onclick="testCheckinHistory()">测试签到历史</button>
                <button class="test-btn" onclick="performCheckin()">执行签到</button>
            </div>
        </div>

        <!-- 功能特色 -->
        <div class="feature-list">
            <div class="feature-title">🎯 功能特色</div>
            <div class="feature-item">
                <span class="feature-icon">✨</span>
                <span>每日签到获得10声望值基础奖励</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🔥</span>
                <span>连续7天签到额外获得5声望值</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🏆</span>
                <span>连续30天签到额外获得10声望值</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🛡️</span>
                <span>防重复签到保护机制</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">📊</span>
                <span>详细的签到统计和历史记录</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🎨</span>
                <span>现代化响应式用户界面</span>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        const USER_ID = 1; // 演示用户ID

        // 页面加载时初始化
        window.onload = function() {
            testCheckinStatus();
            testCheckinStats();
        };

        // 测试签到状态
        async function testCheckinStatus() {
            try {
                const response = await fetch(`${API_BASE}/users/checkin/status`, {
                    headers: {
                        'X-User-Id': USER_ID
                    }
                });
                const data = await response.json();
                
                document.getElementById('statusResponse').textContent = JSON.stringify(data, null, 2);
                
                // 更新UI状态
                const statusElement = document.getElementById('checkinStatus');
                const btnElement = document.getElementById('checkinBtn');
                
                if (data.hasCheckedInToday) {
                    statusElement.textContent = '✅ 今日已签到';
                    btnElement.textContent = '✅ 今日已签到';
                    btnElement.disabled = true;
                } else {
                    statusElement.textContent = '📅 未签到';
                    btnElement.textContent = '🏆 立即签到 (+10声望)';
                    btnElement.disabled = false;
                }
            } catch (error) {
                console.error('测试签到状态失败:', error);
                document.getElementById('statusResponse').textContent = '错误: ' + error.message;
            }
        }

        // 测试签到统计
        async function testCheckinStats() {
            try {
                const response = await fetch(`${API_BASE}/users/${USER_ID}/checkin/stats`);
                const data = await response.json();
                
                // 更新统计显示
                document.getElementById('totalDays').textContent = data.totalDays || 0;
                document.getElementById('consecutiveDays').textContent = data.consecutiveDays || 0;
                document.getElementById('totalReputation').textContent = data.totalReputation || 0;
            } catch (error) {
                console.error('测试签到统计失败:', error);
            }
        }

        // 测试签到历史
        async function testCheckinHistory() {
            try {
                const response = await fetch(`${API_BASE}/users/${USER_ID}/checkin/history?page=0&size=5`);
                const data = await response.json();
                
                alert('签到历史：\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                console.error('测试签到历史失败:', error);
                alert('签到历史获取失败: ' + error.message);
            }
        }

        // 执行签到
        async function performCheckin() {
            const btnElement = document.getElementById('checkinBtn');
            
            // 禁用按钮，显示加载状态
            btnElement.disabled = true;
            btnElement.textContent = '🔄 签到中...';
            
            try {
                const response = await fetch(`${API_BASE}/users/checkin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Id': USER_ID
                    }
                });
                const data = await response.json();
                
                document.getElementById('checkinResponse').textContent = JSON.stringify(data, null, 2);
                
                if (data.success) {
                    // 签到成功
                    btnElement.textContent = '✅ 签到成功！';
                    btnElement.style.background = 'rgba(40, 167, 69, 0.3)';
                    
                    // 更新统计
                    await testCheckinStats();
                    
                    // 显示成功消息
                    alert(`签到成功！🎉\n获得声望：${data.reputationEarned}\n连续天数：${data.consecutiveDays}\n总声望：${data.totalReputation}`);
                } else {
                    // 签到失败
                    btnElement.textContent = data.message || '签到失败';
                    btnElement.disabled = true;
                    alert(data.message || '签到失败');
                }
            } catch (error) {
                console.error('签到失败:', error);
                document.getElementById('checkinResponse').textContent = '错误: ' + error.message;
                btnElement.textContent = '❌ 签到失败';
                alert('签到失败: ' + error.message);
            }
            
            // 重新检查状态
            setTimeout(() => {
                testCheckinStatus();
            }, 1000);
        }
    </script>
</body>
</html>
