<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能修复验证</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .title {
            color: #333;
            border-bottom: 2px solid #409eff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .test-section {
            margin-bottom: 30px;
        }

        .test-button {
            background: #409eff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s;
        }

        .test-button:hover {
            background: #66b1ff;
        }

        .test-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 4px;
            background: #f0f9ff;
            border-left: 4px solid #409eff;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .result.success {
            background: #f0f9f0;
            border-left-color: #67c23a;
            color: #67c23a;
        }

        .result.error {
            background: #fef0f0;
            border-left-color: #f56c6c;
            color: #f56c6c;
        }

        .question-item {
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            background: white;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .question-stats {
            display: flex;
            gap: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-weight: bold;
            color: #409eff;
        }

        .answer-item {
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            background: #fafafa;
        }

        .accepted {
            border-color: #67c23a;
            background: #f0f9f0;
        }

        .accepted::before {
            content: "✅ 已采纳 ";
            color: #67c23a;
            font-weight: bold;
        }

        .accept-button {
            background: #67c23a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .accept-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>🔧 功能修复验证</h1>
    
    <!-- 采纳功能测试 -->
    <div class="card">
        <h2 class="title">1. 采纳功能修复验证</h2>
        <div class="test-section">
            <h3>测试场景：尝试重复采纳</h3>
            <p>问题ID 1已经有被采纳的回答，现在尝试采纳其他回答应该会失败</p>
            
            <button class="test-button" onclick="loadQuestionAnswers()">加载问题回答</button>
            <button class="test-button" onclick="testAcceptAnswer()">测试重复采纳</button>
            
            <div id="acceptResult" class="result"></div>
        </div>
    </div>

    <!-- 时间显示测试 -->
    <div class="card">
        <h2 class="title">2. 时间显示修复验证</h2>
        <div class="test-section">
            <h3>测试场景：首页问题列表时间显示</h3>
            <p>验证问题创建时间是否正确显示为相对时间</p>
            
            <button class="test-button" onclick="loadHomeQuestions()">加载首页问题</button>
            <button class="test-button" onclick="loadQuestionDetail()">加载问题详情</button>
            
            <div id="timeResult" class="result"></div>
        </div>
    </div>

    <!-- 综合功能测试 -->
    <div class="card">
        <h2 class="title">3. 综合功能测试</h2>
        <div class="test-section">
            <h3>测试场景：创建新问题并测试采纳</h3>
            
            <button class="test-button" onclick="createTestQuestion()">创建测试问题</button>
            <button class="test-button" onclick="createTestAnswer()">创建测试回答</button>
            <button class="test-button" onclick="testNewAccept()">测试新采纳</button>
            
            <div id="comprehensiveResult" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        const USER_ID = 1; // scw用户ID
        let testQuestionId = null;
        let testAnswerId = null;

        async function apiCall(url, options = {}) {
            try {
                const defaultOptions = {
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Id': USER_ID.toString()
                    }
                };

                const response = await fetch(url, {
                    ...defaultOptions,
                    ...options,
                    headers: {
                        ...defaultOptions.headers,
                        ...options.headers
                    }
                });

                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now.getTime() - date.getTime();
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (days > 0) return `${days}天前`;
            if (hours > 0) return `${hours}小时前`;
            if (minutes > 0) return `${minutes}分钟前`;
            return '刚刚';
        }

        function updateResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `result ${type}`;
        }

        // 加载问题回答
        async function loadQuestionAnswers() {
            updateResult('acceptResult', '正在加载问题回答...');
            
            const result = await apiCall(`${API_BASE}/questions/1/answers`);
            
            if (result.success) {
                const answers = result.data.content || result.data;
                let output = '✅ 问题回答加载成功\n\n';
                
                answers.forEach((answer, index) => {
                    output += `回答${index + 1}：\n`;
                    output += `  ID: ${answer.id}\n`;
                    output += `  内容: ${answer.content.substring(0, 50)}...\n`;
                    output += `  作者: ${answer.author.username}\n`;
                    output += `  采纳状态: ${answer.accepted ? '✅ 已采纳' : '⏳ 未采纳'}\n`;
                    output += `  创建时间: ${formatTime(answer.createdAt)}\n\n`;
                });
                
                updateResult('acceptResult', output, 'success');
            } else {
                updateResult('acceptResult', `❌ 加载失败: ${result.error || result.data.message}`, 'error');
            }
        }

        // 测试重复采纳
        async function testAcceptAnswer() {
            updateResult('acceptResult', '正在测试重复采纳...');
            
            // 尝试采纳ID为12的回答（应该会失败）
            const result = await apiCall(`${API_BASE}/questions/1/accept`, {
                method: 'POST',
                body: JSON.stringify({ answerId: 12 })
            });
            
            if (!result.success || !result.data.success) {
                updateResult('acceptResult', 
                    `✅ 采纳功能修复成功！\n防重复采纳正常工作\n错误信息: ${result.data?.message || result.error}`, 
                    'success');
            } else {
                updateResult('acceptResult', 
                    `❌ 采纳功能修复失败！\n仍然可以重复采纳\n响应: ${JSON.stringify(result.data)}`, 
                    'error');
            }
        }

        // 加载首页问题
        async function loadHomeQuestions() {
            updateResult('timeResult', '正在加载首页问题...');
            
            const result = await apiCall(`${API_BASE}/questions?page=0&size=5&sortBy=createdAt&sortDirection=desc`);
            
            if (result.success) {
                const questions = result.data.content || result.data;
                let output = '✅ 首页问题加载成功\n\n';
                
                questions.forEach((question, index) => {
                    output += `问题${index + 1}：\n`;
                    output += `  标题: ${question.title}\n`;
                    output += `  浏览数: ${question.viewCount || 'N/A'}\n`;
                    output += `  回答数: ${question.answerCount}\n`;
                    output += `  投票数: ${question.votes}\n`;
                    output += `  创建时间(原始): ${question.createdAt}\n`;
                    output += `  创建时间(格式化): ${formatTime(question.createdAt)}\n\n`;
                });
                
                updateResult('timeResult', output, 'success');
            } else {
                updateResult('timeResult', `❌ 加载失败: ${result.error || result.data.message}`, 'error');
            }
        }

        // 加载问题详情
        async function loadQuestionDetail() {
            updateResult('timeResult', '正在加载问题详情...');
            
            const result = await apiCall(`${API_BASE}/questions/1`);
            
            if (result.success) {
                const question = result.data;
                let output = '✅ 问题详情加载成功\n\n';
                output += `标题: ${question.title}\n`;
                output += `浏览数: ${question.viewCount}\n`;
                output += `回答数: ${question.answerCount}\n`;
                output += `投票数: ${question.votes}\n`;
                output += `创建时间(原始): ${question.createdAt}\n`;
                output += `创建时间(格式化): ${formatTime(question.createdAt)}\n`;
                output += `更新时间(原始): ${question.updatedAt}\n`;
                output += `更新时间(格式化): ${formatTime(question.updatedAt)}\n`;
                
                updateResult('timeResult', output, 'success');
            } else {
                updateResult('timeResult', `❌ 加载失败: ${result.error || result.data.message}`, 'error');
            }
        }

        // 创建测试问题
        async function createTestQuestion() {
            updateResult('comprehensiveResult', '正在创建测试问题...');
            
            const result = await apiCall(`${API_BASE}/questions`, {
                method: 'POST',
                body: JSON.stringify({
                    title: '采纳功能测试问题 - ' + new Date().toLocaleString(),
                    content: '这是一个专门用来测试采纳功能修复的问题。',
                    tags: ['测试'],
                    authorId: USER_ID
                })
            });
            
            if (result.success && result.data.id) {
                testQuestionId = result.data.id;
                updateResult('comprehensiveResult', 
                    `✅ 测试问题创建成功\n问题ID: ${testQuestionId}\n标题: ${result.data.title}`, 
                    'success');
            } else {
                updateResult('comprehensiveResult', 
                    `❌ 创建问题失败: ${result.error || result.data.message}`, 
                    'error');
            }
        }

        // 创建测试回答
        async function createTestAnswer() {
            if (!testQuestionId) {
                updateResult('comprehensiveResult', '❌ 请先创建测试问题', 'error');
                return;
            }
            
            updateResult('comprehensiveResult', '正在创建测试回答...');
            
            const result = await apiCall(`${API_BASE}/questions/${testQuestionId}/answers`, {
                method: 'POST',
                body: JSON.stringify({
                    content: '这是一个测试回答，用来验证采纳功能。创建时间：' + new Date().toLocaleString(),
                    authorId: USER_ID
                })
            });
            
            if (result.success) {
                if (result.data.answer) {
                    testAnswerId = result.data.answer.id;
                } else if (result.data.id) {
                    testAnswerId = result.data.id;
                }
                
                updateResult('comprehensiveResult', 
                    `✅ 测试回答创建成功\n回答ID: ${testAnswerId}\n问题ID: ${testQuestionId}`, 
                    'success');
            } else {
                updateResult('comprehensiveResult', 
                    `❌ 创建回答失败: ${result.error || result.data.message}`, 
                    'error');
            }
        }

        // 测试新采纳
        async function testNewAccept() {
            if (!testQuestionId || !testAnswerId) {
                updateResult('comprehensiveResult', '❌ 请先创建测试问题和回答', 'error');
                return;
            }
            
            updateResult('comprehensiveResult', '正在测试采纳功能...');
            
            // 第一次采纳应该成功
            const firstResult = await apiCall(`${API_BASE}/questions/${testQuestionId}/accept`, {
                method: 'POST',
                body: JSON.stringify({ answerId: testAnswerId })
            });
            
            if (firstResult.success && firstResult.data.success) {
                // 第二次采纳应该失败
                const secondResult = await apiCall(`${API_BASE}/questions/${testQuestionId}/accept`, {
                    method: 'POST',
                    body: JSON.stringify({ answerId: testAnswerId })
                });
                
                if (!secondResult.success || !secondResult.data.success) {
                    updateResult('comprehensiveResult', 
                        `✅ 采纳功能修复验证成功！\n第一次采纳: 成功\n第二次采纳: 失败(${secondResult.data?.message || secondResult.error})\n防重复采纳功能正常工作`, 
                        'success');
                } else {
                    updateResult('comprehensiveResult', 
                        `❌ 采纳功能修复失败！\n第二次采纳仍然成功，没有防止重复采纳`, 
                        'error');
                }
            } else {
                updateResult('comprehensiveResult', 
                    `❌ 第一次采纳失败: ${firstResult.data?.message || firstResult.error}`, 
                    'error');
            }
        }

        // 页面加载时的说明
        window.onload = function() {
            console.log('🔧 功能修复验证页面已加载');
            console.log('📝 测试用户ID:', USER_ID);
            console.log('🎯 将测试采纳功能和时间显示修复');
        };
    </script>
</body>
</html>
