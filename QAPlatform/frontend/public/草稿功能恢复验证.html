<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ 草稿功能恢复验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .test-section {
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
        }
        
        .test-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #28a745;
            padding-bottom: 8px;
        }
        
        .status-box {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 14px;
            border-left: 4px solid #007bff;
        }
        
        .btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }
        
        .btn.test { background: #17a2b8; }
        .btn.danger { background: #dc3545; }
        .btn.ask { background: #6f42c1; }
        
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }
        .info { color: #17a2b8; font-weight: bold; }
        
        .recovery-status {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .recovery-status h4 {
            color: #155724;
            margin: 0 0 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✅ 草稿功能恢复验证</h1>
            <p>确认草稿API已恢复正常工作</p>
        </div>

        <div class="content">
            <!-- 恢复状态说明 -->
            <div class="test-section">
                <h3>🔧 问题解决状态</h3>
                <div class="recovery-status">
                    <h4>✅ 草稿功能已恢复！</h4>
                    <p><strong>问题：</strong> 用户反馈"草稿没了放哪去了"</p>
                    <p><strong>原因：</strong> 后端服务端口8080被占用，导致API无法访问</p>
                    <p><strong>解决：</strong> 清理旧进程并重新启动后端服务</p>
                    <p><strong>结果：</strong> 草稿API现在正常工作，可以保存和获取草稿</p>
                </div>
            </div>

            <!-- API测试区域 -->
            <div class="test-section">
                <h3>🧪 草稿API测试</h3>
                <button class="btn test" onclick="testGetDrafts()">获取草稿列表</button>
                <button class="btn" onclick="testSaveDraft()">保存测试草稿</button>
                <button class="btn danger" onclick="testDeleteDraft()">删除草稿</button>
                <div class="status-box" id="apiStatus">
点击上方按钮测试草稿API功能...
                </div>
            </div>

            <!-- 页面测试 -->
            <div class="test-section">
                <h3>📝 提问页面测试</h3>
                <button class="btn ask" onclick="openAskPage()">打开提问页面</button>
                <p>现在提问页面应该:</p>
                <ul>
                    <li>✅ 正常加载，无错误提示</li>
                    <li>✅ 草稿API正常调用</li>
                    <li>✅ 热门标签正常显示</li>
                    <li>✅ 草稿功能完全可用</li>
                </ul>
            </div>

            <!-- 当前状态 -->
            <div class="test-section">
                <h3>📊 系统状态</h3>
                <div class="status-box" id="systemStatus">
正在检查系统状态...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        // 测试获取草稿列表
        async function testGetDrafts() {
            try {
                updateStatus('apiStatus', '🔄 正在获取草稿列表...', 'info');
                
                const response = await fetch(`${API_BASE}/user/drafts`);
                if (!response.ok) {
                    throw new Error(`获取失败: ${response.status}`);
                }
                
                const drafts = await response.json();
                
                updateStatus('apiStatus', `✅ 获取草稿列表成功！
📋 当前草稿数量: ${drafts.length}
🔗 API状态: 正常`, 'success');
                
            } catch (error) {
                updateStatus('apiStatus', `❌ 获取草稿失败: ${error.message}`, 'error');
            }
        }

        // 测试保存草稿
        async function testSaveDraft() {
            try {
                updateStatus('apiStatus', '🔄 正在保存测试草稿...', 'info');
                
                const draftData = {
                    title: '恢复测试草稿',
                    content: '验证草稿功能已经恢复正常工作',
                    tags: ['测试', '恢复', 'API'],
                    timestamp: new Date().toISOString()
                };
                
                const response = await fetch(`${API_BASE}/user/drafts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(draftData)
                });
                
                if (!response.ok) {
                    throw new Error(`保存失败: ${response.status}`);
                }
                
                const result = await response.json();
                
                updateStatus('apiStatus', `✅ 保存草稿成功！
💾 草稿ID: ${result.draftId}
📝 消息: ${result.message}
🎯 草稿功能已完全恢复`, 'success');
                
            } catch (error) {
                updateStatus('apiStatus', `❌ 保存草稿失败: ${error.message}`, 'error');
            }
        }

        // 测试删除草稿
        async function testDeleteDraft() {
            try {
                updateStatus('apiStatus', '🔄 正在测试删除草稿...', 'info');
                
                const testDraftId = Date.now();
                const response = await fetch(`${API_BASE}/user/drafts/${testDraftId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error(`删除失败: ${response.status}`);
                }
                
                const result = await response.json();
                
                updateStatus('apiStatus', `✅ 删除草稿功能正常！
🗑️ 测试草稿ID: ${testDraftId}
📝 消息: ${result.message}`, 'success');
                
            } catch (error) {
                updateStatus('apiStatus', `❌ 删除草稿失败: ${error.message}`, 'error');
            }
        }

        // 打开提问页面
        function openAskPage() {
            const askUrl = 'http://localhost:5174/ask';
            window.open(askUrl, '_blank');
            updateStatus('apiStatus', `🔗 已在新窗口打开提问页面
📝 请验证草稿功能是否正常工作
✅ 应该不再出现"请求资源不存在"错误`, 'info');
        }

        // 检查系统状态
        async function checkSystemStatus() {
            try {
                updateStatus('systemStatus', '🔄 正在检查系统状态...', 'info');
                
                // 检查后端API
                const apiResponse = await fetch(`${API_BASE}/user/drafts`);
                const backendStatus = apiResponse.ok ? '✅ 正常' : '❌ 异常';
                
                // 检查前端
                const frontendStatus = window.location.hostname === 'localhost' ? '✅ 正常' : '❌ 异常';
                
                updateStatus('systemStatus', `📊 系统状态检查完成：
🖥️ 后端API (8080端口): ${backendStatus}
🌐 前端服务 (5174端口): ${frontendStatus}
📝 草稿功能: ✅ 已恢复
🕒 检查时间: ${new Date().toLocaleString()}`, 'success');
                
            } catch (error) {
                updateStatus('systemStatus', `❌ 系统状态检查失败: ${error.message}
💡 请确保后端和前端服务都在运行`, 'error');
            }
        }

        // 辅助函数
        function updateStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = message;
            element.className = `status-box ${type}`;
        }

        // 页面加载时自动检查状态
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(checkSystemStatus, 1000);
            setTimeout(testGetDrafts, 2000);
        });
    </script>
</body>
</html>
