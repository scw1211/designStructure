<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页问题诊断工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; }
        .test-section { background: white; margin: 15px 0; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .status { padding: 8px 12px; border-radius: 4px; margin: 8px 0; }
        .success { background: #e7f5e7; color: #2d7d2d; border: 1px solid #b8e6b8; }
        .error { background: #ffeaea; color: #d93025; border: 1px solid #ffb3b3; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button { background: #409eff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #337ab7; }
        .data-display { background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; overflow: auto; max-height: 200px; margin: 10px 0; }
        .loading { color: #666; font-style: italic; }
        .api-test { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        h1 { color: #333; text-align: center; }
        h2 { color: #409eff; border-bottom: 2px solid #409eff; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 主页问题诊断工具</h1>
        
        <div class="test-section">
            <h2>🌐 服务状态检查</h2>
            <button onclick="checkServices()">检查服务状态</button>
            <div id="service-status"></div>
        </div>

        <div class="test-section">
            <h2>🔌 API连通性测试</h2>
            <button onclick="testAllAPIs()">测试所有API</button>
            <div id="api-results"></div>
        </div>

        <div class="test-section">
            <h2>🏠 Vue主页模拟测试</h2>
            <button onclick="simulateHomeLoad()">模拟主页数据加载</button>
            <div id="home-simulation"></div>
        </div>

        <div class="test-section">
            <h2>🩺 网络诊断</h2>
            <button onclick="networkDiagnostic()">网络诊断</button>
            <div id="network-results"></div>
        </div>

        <div class="test-section">
            <h2>💻 控制台输出</h2>
            <div id="console-output" class="data-display" style="height: 200px; background: #000; color: #0f0;"></div>
            <button onclick="clearConsole()">清除输出</button>
        </div>
    </div>

    <script>
        const log = (message, type = 'info') => {
            const output = document.getElementById('console-output');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f56565' : type === 'success' ? '#48bb78' : type === 'warning' ? '#ed8936' : '#0f0';
            output.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            output.scrollTop = output.scrollHeight;
            console.log(message);
        };

        const clearConsole = () => {
            document.getElementById('console-output').innerHTML = '';
        };

        // 检查服务状态
        const checkServices = async () => {
            const statusDiv = document.getElementById('service-status');
            statusDiv.innerHTML = '<div class="loading">检查中...</div>';
            
            let results = '';
            
            // 检查前端服务
            try {
                const frontendResponse = await fetch(window.location.origin);
                if (frontendResponse.ok) {
                    results += '<div class="status success">✅ 前端服务正常 (端口 5174)</div>';
                    log('前端服务正常', 'success');
                } else {
                    results += '<div class="status error">❌ 前端服务异常</div>';
                    log('前端服务异常', 'error');
                }
            } catch (error) {
                results += '<div class="status error">❌ 前端服务连接失败</div>';
                log('前端服务连接失败: ' + error.message, 'error');
            }

            // 检查后端服务
            try {
                const backendResponse = await fetch('/api/users');
                if (backendResponse.ok) {
                    results += '<div class="status success">✅ 后端服务正常 (端口 8080)</div>';
                    log('后端服务正常', 'success');
                } else {
                    results += '<div class="status error">❌ 后端服务响应异常: ' + backendResponse.status + '</div>';
                    log('后端服务响应异常: ' + backendResponse.status, 'error');
                }
            } catch (error) {
                results += '<div class="status error">❌ 后端服务连接失败: ' + error.message + '</div>';
                log('后端服务连接失败: ' + error.message, 'error');
            }

            statusDiv.innerHTML = results;
        };

        // 测试所有API
        const testAllAPIs = async () => {
            const resultsDiv = document.getElementById('api-results');
            resultsDiv.innerHTML = '<div class="loading">测试中...</div>';
            
            const apis = [
                { name: '平台概览', url: '/api/analytics/platform-overview' },
                { name: '专家用户', url: '/api/analytics/expert-users?limit=5' },
                { name: '热门问题', url: '/api/analytics/trending-questions?limit=6' },
                { name: '标签统计', url: '/api/analytics/tag-statistics?limit=10' },
                { name: '徽章统计', url: '/api/analytics/badge-statistics' },
                { name: '活动时间线', url: '/api/analytics/activity-timeline?days=7' },
                { name: '问题列表', url: '/api/questions?page=0&size=10&sortBy=createdAt&sortDirection=desc' }
            ];

            let results = '';
            
            for (const api of apis) {
                try {
                    log(`测试 ${api.name} API...`);
                    const response = await fetch(api.url);
                    if (response.ok) {
                        const data = await response.json();
                        results += `<div class="api-test">
                            <div class="status success">✅ ${api.name} - 成功</div>
                            <div class="data-display">${JSON.stringify(data, null, 2).substring(0, 300)}...</div>
                        </div>`;
                        log(`${api.name} API 成功, 数据长度: ${JSON.stringify(data).length}`, 'success');
                    } else {
                        results += `<div class="api-test">
                            <div class="status error">❌ ${api.name} - 失败 (${response.status})</div>
                        </div>`;
                        log(`${api.name} API 失败: ${response.status}`, 'error');
                    }
                } catch (error) {
                    results += `<div class="api-test">
                        <div class="status error">❌ ${api.name} - 错误: ${error.message}</div>
                    </div>`;
                    log(`${api.name} API 错误: ${error.message}`, 'error');
                }
            }
            
            resultsDiv.innerHTML = results;
        };

        // 模拟Vue主页加载
        const simulateHomeLoad = async () => {
            const simulationDiv = document.getElementById('home-simulation');
            simulationDiv.innerHTML = '<div class="loading">模拟主页加载中...</div>';
            
            log('开始模拟Vue主页数据加载...');
            
            const homeData = {
                platformStats: {},
                expertUsers: [],
                trendingQuestions: [],
                tagStatistics: [],
                badgeStatistics: [],
                activityTimeline: [],
                questions: []
            };

            let results = '<h3>模拟Vue Home.vue数据加载:</h3>';
            
            try {
                // 模拟并行加载所有数据（如Vue组件中的Promise.all）
                log('执行 Promise.all 并行加载...');
                
                const loadPromises = [
                    fetch('/api/analytics/platform-overview').then(r => r.json()),
                    fetch('/api/analytics/expert-users?limit=5').then(r => r.json()),
                    fetch('/api/analytics/trending-questions?limit=6').then(r => r.json()),
                    fetch('/api/analytics/tag-statistics?limit=10').then(r => r.json()),
                    fetch('/api/analytics/badge-statistics').then(r => r.json()),
                    fetch('/api/analytics/activity-timeline?days=7').then(r => r.json())
                ];

                const [platformStats, expertUsers, trendingQuestions, tagStats, badgeStats, activityTimeline] = await Promise.all(loadPromises);
                
                homeData.platformStats = platformStats;
                homeData.expertUsers = expertUsers;
                homeData.trendingQuestions = trendingQuestions;
                homeData.tagStatistics = tagStats;
                homeData.badgeStatistics = badgeStats;
                homeData.activityTimeline = activityTimeline;
                
                results += '<div class="status success">✅ 所有高级数据加载成功</div>';
                log('所有高级数据加载成功', 'success');
                
                // 检查数据是否为空
                if (homeData.platformStats.totalQuestions > 0) {
                    results += '<div class="status success">✅ 平台统计数据正常</div>';
                } else {
                    results += '<div class="status warning">⚠️ 平台统计数据为空或异常</div>';
                }
                
                if (homeData.expertUsers.length > 0) {
                    results += '<div class="status success">✅ 专家用户数据正常</div>';
                } else {
                    results += '<div class="status warning">⚠️ 专家用户数据为空</div>';
                }
                
                if (homeData.trendingQuestions.length > 0) {
                    results += '<div class="status success">✅ 热门问题数据正常</div>';
                } else {
                    results += '<div class="status warning">⚠️ 热门问题数据为空</div>';
                }
                
                results += '<div class="data-display">' + JSON.stringify(homeData, null, 2) + '</div>';
                
            } catch (error) {
                results += '<div class="status error">❌ 数据加载失败: ' + error.message + '</div>';
                log('数据加载失败: ' + error.message, 'error');
            }
            
            simulationDiv.innerHTML = results;
        };

        // 网络诊断
        const networkDiagnostic = async () => {
            const resultsDiv = document.getElementById('network-results');
            resultsDiv.innerHTML = '<div class="loading">诊断中...</div>';
            
            let results = '';
            
            // 检查浏览器信息
            results += `<div class="status">🌐 浏览器: ${navigator.userAgent}</div>`;
            results += `<div class="status">📍 当前URL: ${window.location.href}</div>`;
            results += `<div class="status">🔗 Origin: ${window.location.origin}</div>`;
            
            // 检查缓存
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    if (registrations.length > 0) {
                        results += '<div class="status warning">⚠️ 检测到Service Worker，可能影响缓存</div>';
                    } else {
                        results += '<div class="status">ℹ️ 无Service Worker</div>';
                    }
                } catch (e) {
                    results += '<div class="status">ℹ️ Service Worker检查失败</div>';
                }
            }
            
            // 检测响应时间
            const startTime = performance.now();
            try {
                await fetch('/api/analytics/platform-overview');
                const endTime = performance.now();
                const responseTime = Math.round(endTime - startTime);
                results += `<div class="status ${responseTime > 1000 ? 'warning' : 'success'}">⏱️ API响应时间: ${responseTime}ms</div>`;
            } catch (error) {
                results += '<div class="status error">❌ API响应时间测试失败</div>';
            }
            
            results += '<div class="status success">💡 建议：如果主页仍显示空白，请尝试强制刷新 (Cmd+Shift+R)</div>';
            
            resultsDiv.innerHTML = results;
        };

        // 页面加载时自动运行基本检查
        window.onload = () => {
            log('诊断工具已加载');
            log('请点击上方按钮进行各项测试');
            log('如果您的主页显示空白，这个工具将帮助定位问题');
        };
    </script>
</body>
</html>
