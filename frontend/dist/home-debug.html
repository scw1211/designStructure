<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页调试工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; }
        .test-section { background: white; margin: 15px 0; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .status { padding: 8px 12px; border-radius: 4px; margin: 8px 0; }
        .success { background: #e7f5e7; color: #2d7d2d; border: 1px solid #b8e6b8; }
        .error { background: #ffeaea; color: #d93025; border: 1px solid #ffb3b3; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button { background: #409eff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #337ab7; }
        .result { background: #f8f9fa; padding: 15px; border-radius: 4px; margin: 10px 0; max-height: 300px; overflow-y: auto; }
        .loading { color: #666; font-style: italic; }
        .section-title { color: #333; margin-bottom: 15px; font-weight: bold; }
        .api-test { border-left: 3px solid #409eff; padding-left: 15px; margin: 10px 0; }
        .data-item { background: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 主页API调试工具</h1>
        
        <div class="test-section">
            <h3 class="section-title">🔧 服务连接测试</h3>
            <button onclick="testConnection()">测试服务连接</button>
            <div id="connection-result"></div>
        </div>

        <div class="test-section">
            <h3 class="section-title">📊 主页API测试</h3>
            <button onclick="testAllAPIs()">测试所有主页API</button>
            <button onclick="testPlatformOverview()">平台概览</button>
            <button onclick="testExpertUsers()">专家用户</button>
            <button onclick="testTrendingQuestions()">热门问题</button>
            <button onclick="testTagStatistics()">标签统计</button>
            <button onclick="testBadgeStatistics()">徽章统计</button>
            <button onclick="testActivityTimeline()">活动时间线</button>
            <div id="api-result"></div>
        </div>

        <div class="test-section">
            <h3 class="section-title">🏠 Vue主页模拟测试</h3>
            <button onclick="simulateVueHomePage()">模拟Vue主页加载</button>
            <div id="vue-result"></div>
        </div>

        <div class="test-section">
            <h3 class="section-title">🌐 网络诊断</h3>
            <button onclick="networkDiagnosis()">网络诊断</button>
            <div id="network-result"></div>
        </div>

        <div class="test-section">
            <h3 class="section-title">📝 实时日志</h3>
            <button onclick="clearLogs()">清除日志</button>
            <div id="logs" class="result"></div>
        </div>
    </div>

    <script>
        let logContainer = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const logClass = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logContainer.innerHTML += `<div class="status ${logClass}">[${time}] ${message}</div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLogs() {
            logContainer.innerHTML = '';
        }

        // 测试服务连接
        async function testConnection() {
            const resultDiv = document.getElementById('connection-result');
            resultDiv.innerHTML = '<div class="loading">🔄 检测服务状态...</div>';
            
            try {
                log('开始检测服务连接状态...');
                
                // 测试后端连接
                const backendResponse = await fetch('/api/analytics/platform-overview');
                const backendStatus = backendResponse.ok ? '✅ 正常' : '❌ 异常';
                
                // 测试前端静态资源
                const frontendResponse = await fetch('/');
                const frontendStatus = frontendResponse.ok ? '✅ 正常' : '❌ 异常';
                
                resultDiv.innerHTML = `
                    <div class="api-test">
                        <strong>🔍 服务状态检测结果：</strong><br>
                        • 后端API (8080): ${backendStatus}<br>
                        • 前端服务 (5174): ${frontendStatus}<br>
                        • 代理配置: ${backendResponse.ok ? '✅ 正常' : '❌ 异常'}
                    </div>
                `;
                
                log(`服务检测完成 - 后端: ${backendStatus}, 前端: ${frontendStatus}`, 
                    backendResponse.ok && frontendResponse.ok ? 'success' : 'error');
                    
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">❌ 连接测试失败: ${error.message}</div>`;
                log(`服务连接测试失败: ${error.message}`, 'error');
            }
        }

        // 测试单个API
        async function testAPI(endpoint, name) {
            try {
                log(`正在测试 ${name} API...`);
                const response = await fetch(endpoint);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                log(`✅ ${name} API 测试成功`, 'success');
                return { success: true, data, endpoint };
            } catch (error) {
                log(`❌ ${name} API 测试失败: ${error.message}`, 'error');
                return { success: false, error: error.message, endpoint };
            }
        }

        // 测试所有主页API
        async function testAllAPIs() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '<div class="loading">🔄 测试所有主页API...</div>';
            
            log('开始测试所有主页API...');
            
            const apis = [
                { endpoint: '/api/analytics/platform-overview', name: '平台概览' },
                { endpoint: '/api/analytics/expert-users?limit=5', name: '专家用户' },
                { endpoint: '/api/analytics/trending-questions?limit=6', name: '热门问题' },
                { endpoint: '/api/analytics/tag-statistics?limit=10', name: '标签统计' },
                { endpoint: '/api/analytics/badge-statistics', name: '徽章统计' },
                { endpoint: '/api/analytics/activity-timeline?days=7', name: '活动时间线' }
            ];
            
            const results = [];
            for (const api of apis) {
                const result = await testAPI(api.endpoint, api.name);
                results.push(result);
            }
            
            const successCount = results.filter(r => r.success).length;
            const failureCount = results.length - successCount;
            
            let html = `
                <div class="api-test">
                    <strong>📊 API测试汇总：</strong><br>
                    • 成功: ${successCount}/${results.length}<br>
                    • 失败: ${failureCount}/${results.length}<br><br>
                </div>
            `;
            
            results.forEach(result => {
                if (result.success) {
                    html += `
                        <div class="data-item">
                            <strong>✅ ${result.endpoint}</strong><br>
                            <small>数据预览: ${JSON.stringify(result.data).substring(0, 100)}...</small>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="data-item" style="border-left: 3px solid #dc3545;">
                            <strong>❌ ${result.endpoint}</strong><br>
                            <small style="color: #dc3545;">错误: ${result.error}</small>
                        </div>
                    `;
                }
            });
            
            resultDiv.innerHTML = html;
            log(`API测试完成 - 成功: ${successCount}, 失败: ${failureCount}`, 
                failureCount === 0 ? 'success' : 'error');
        }

        // 单独测试API函数
        async function testPlatformOverview() {
            const result = await testAPI('/api/analytics/platform-overview', '平台概览');
            document.getElementById('api-result').innerHTML = 
                `<div class="data-item">
                    <strong>${result.success ? '✅' : '❌'} 平台概览</strong><br>
                    ${result.success ? 
                        `<pre>${JSON.stringify(result.data, null, 2)}</pre>` : 
                        `<span style="color: #dc3545;">错误: ${result.error}</span>`}
                </div>`;
        }

        async function testExpertUsers() {
            const result = await testAPI('/api/analytics/expert-users?limit=5', '专家用户');
            document.getElementById('api-result').innerHTML = 
                `<div class="data-item">
                    <strong>${result.success ? '✅' : '❌'} 专家用户</strong><br>
                    ${result.success ? 
                        `<pre>${JSON.stringify(result.data, null, 2)}</pre>` : 
                        `<span style="color: #dc3545;">错误: ${result.error}</span>`}
                </div>`;
        }

        async function testTrendingQuestions() {
            const result = await testAPI('/api/analytics/trending-questions?limit=6', '热门问题');
            document.getElementById('api-result').innerHTML = 
                `<div class="data-item">
                    <strong>${result.success ? '✅' : '❌'} 热门问题</strong><br>
                    ${result.success ? 
                        `<pre>${JSON.stringify(result.data, null, 2)}</pre>` : 
                        `<span style="color: #dc3545;">错误: ${result.error}</span>`}
                </div>`;
        }

        async function testTagStatistics() {
            const result = await testAPI('/api/analytics/tag-statistics?limit=10', '标签统计');
            document.getElementById('api-result').innerHTML = 
                `<div class="data-item">
                    <strong>${result.success ? '✅' : '❌'} 标签统计</strong><br>
                    ${result.success ? 
                        `<pre>${JSON.stringify(result.data, null, 2)}</pre>` : 
                        `<span style="color: #dc3545;">错误: ${result.error}</span>`}
                </div>`;
        }

        async function testBadgeStatistics() {
            const result = await testAPI('/api/analytics/badge-statistics', '徽章统计');
            document.getElementById('api-result').innerHTML = 
                `<div class="data-item">
                    <strong>${result.success ? '✅' : '❌'} 徽章统计</strong><br>
                    ${result.success ? 
                        `<pre>${JSON.stringify(result.data, null, 2)}</pre>` : 
                        `<span style="color: #dc3545;">错误: ${result.error}</span>`}
                </div>`;
        }

        async function testActivityTimeline() {
            const result = await testAPI('/api/analytics/activity-timeline?days=7', '活动时间线');
            document.getElementById('api-result').innerHTML = 
                `<div class="data-item">
                    <strong>${result.success ? '✅' : '❌'} 活动时间线</strong><br>
                    ${result.success ? 
                        `<pre>${JSON.stringify(result.data, null, 2)}</pre>` : 
                        `<span style="color: #dc3545;">错误: ${result.error}</span>`}
                </div>`;
        }

        // 模拟Vue主页加载
        async function simulateVueHomePage() {
            const resultDiv = document.getElementById('vue-result');
            resultDiv.innerHTML = '<div class="loading">🔄 模拟Vue主页数据加载...</div>';
            
            log('开始模拟Vue主页组件加载过程...');
            
            try {
                // 模拟Vue的loadAllData函数
                log('1. 开始并行加载所有数据...');
                
                const promises = [
                    fetch('/api/analytics/platform-overview').then(r => r.json()),
                    fetch('/api/analytics/expert-users?limit=5').then(r => r.json()),
                    fetch('/api/analytics/trending-questions?limit=6').then(r => r.json()),
                    fetch('/api/analytics/tag-statistics?limit=10').then(r => r.json()),
                    fetch('/api/analytics/badge-statistics').then(r => r.json()),
                    fetch('/api/analytics/activity-timeline?days=7').then(r => r.json())
                ];
                
                const results = await Promise.all(promises);
                
                log('2. 所有数据加载完成，开始渲染页面...', 'success');
                
                const [platformStats, expertUsers, trendingQuestions, tagStats, badgeStats, timeline] = results;
                
                let html = `
                    <div class="api-test">
                        <strong>🎉 Vue主页模拟加载成功！</strong><br><br>
                        
                        <div class="data-item">
                            <strong>📊 平台统计:</strong><br>
                            总问题: ${platformStats.totalQuestions} | 
                            总回答: ${platformStats.totalAnswers} | 
                            总用户: ${platformStats.totalUsers}
                        </div>
                        
                        <div class="data-item">
                            <strong>👑 专家用户:</strong><br>
                            加载了 ${expertUsers.length} 位专家用户
                        </div>
                        
                        <div class="data-item">
                            <strong>🔥 热门问题:</strong><br>
                            加载了 ${trendingQuestions.length} 个热门问题
                        </div>
                        
                        <div class="data-item">
                            <strong>🏷️ 标签统计:</strong><br>
                            加载了 ${tagStats.length} 个热门标签
                        </div>
                        
                        <div class="data-item">
                            <strong>🏆 徽章统计:</strong><br>
                            加载了 ${badgeStats.length} 种徽章类型
                        </div>
                        
                        <div class="data-item">
                            <strong>📈 活动时间线:</strong><br>
                            加载了 ${timeline.length} 天的活动数据
                        </div>
                    </div>
                `;
                
                resultDiv.innerHTML = html;
                log('3. Vue主页模拟加载完成！页面应该显示所有内容', 'success');
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">❌ Vue主页模拟加载失败: ${error.message}</div>`;
                log(`Vue主页模拟加载失败: ${error.message}`, 'error');
            }
        }

        // 网络诊断
        async function networkDiagnosis() {
            const resultDiv = document.getElementById('network-result');
            resultDiv.innerHTML = '<div class="loading">🔄 执行网络诊断...</div>';
            
            log('开始网络诊断...');
            
            const diagnostics = {
                userAgent: navigator.userAgent,
                onLine: navigator.onLine,
                cookieEnabled: navigator.cookieEnabled,
                url: window.location.href,
                referrer: document.referrer || '直接访问',
                localStorage: !!window.localStorage,
                sessionStorage: !!window.sessionStorage
            };
            
            let html = `
                <div class="api-test">
                    <strong>🌐 网络环境诊断：</strong><br><br>
                    
                    <div class="data-item">
                        <strong>浏览器信息:</strong><br>
                        ${diagnostics.userAgent}
                    </div>
                    
                    <div class="data-item">
                        <strong>网络状态:</strong> ${diagnostics.onLine ? '✅ 在线' : '❌ 离线'}<br>
                        <strong>Cookie:</strong> ${diagnostics.cookieEnabled ? '✅ 启用' : '❌ 禁用'}<br>
                        <strong>LocalStorage:</strong> ${diagnostics.localStorage ? '✅ 支持' : '❌ 不支持'}<br>
                        <strong>SessionStorage:</strong> ${diagnostics.sessionStorage ? '✅ 支持' : '❌ 不支持'}
                    </div>
                    
                    <div class="data-item">
                        <strong>页面信息:</strong><br>
                        URL: ${diagnostics.url}<br>
                        来源: ${diagnostics.referrer}
                    </div>
                </div>
            `;
            
            resultDiv.innerHTML = html;
            log('网络诊断完成', 'success');
        }

        // 页面加载时自动运行基础检测
        window.onload = function() {
            log('🏠 主页调试工具已加载', 'success');
            testConnection();
        };
    </script>
</body>
</html>
